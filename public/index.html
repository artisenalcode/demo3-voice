<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text to Voice Demo</title>
    <meta name="description" content="Type text and hear it spoken, using Kokoro 82M through OpenRouter." />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Voice AI demo</p>
        <h1>Text to voice</h1>
        <p class="lead">
          Type up to 500 characters and hear them spoken. Runs on Kokoro 82M through OpenRouter, at
          about US$0.62 per million characters.
        </p>
      </header>

      <form id="tts-form" novalidate>
        <div class="field">
          <label for="text">Text to speak</label>
          <p id="text-hint" class="hint">Replace the sample sentence with your own text.</p>
          <textarea id="text" name="text" rows="6" maxlength="500" required aria-describedby="text-hint count">The quick brown fox jumps over the lazy dog.</textarea>
          <p id="count" class="hint">0 / 500 characters</p>
        </div>

        <div class="field">
          <label for="voice">Voice</label>
          <select id="voice" name="voice">
            <option value="af_alloy">Alloy (American English, female)</option>
            <option value="am_onyx">Onyx (American English, male)</option>
            <option value="bf_alice">Alice (British English, female)</option>
            <option value="bm_daniel">Daniel (British English, male)</option>
          </select>
        </div>

        <button id="speak" type="submit">Speak</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>

      <section id="result" class="result" hidden>
        <h2>Result</h2>
        <audio id="player" controls></audio>
        <a id="download" download="demo3-voice.mp3" href="#">Download MP3</a>
      </section>
    </main>

    <footer>
      Built by <a href="https://alvin.starandstream.com">Alvin Tolentino</a> ·
      <a href="https://starandstream.com">Star and Stream</a>
    </footer>
  </body>
</html>
