name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            mkdir -p /data/code/demo3.starandstream.com
            cd /data/code/demo3.starandstream.com

            if [ ! -d ".git" ]; then
                git clone git@github.com:artisenalcode/demo3-voice.git .
            fi

            git merge --abort 2>/dev/null || true
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            # Refresh the encrypted secrets store and render /data/env/*.env.
            # The age private key exists only on this box, so GitHub Actions
            # never handles the OpenRouter key.
            export PATH="$HOME/.local/bin:$PATH"
            git -C /data/secrets fetch --prune origin
            git -C /data/secrets reset --hard origin/main
            /data/secrets/render.sh /data/env
            if ! grep -q '^OPENROUTER_API_KEY=.' /data/env/demo3.env 2>/dev/null; then
                echo "OPENROUTER_API_KEY missing from /data/env/demo3.env; add it to the secrets store" >&2
                exit 1
            fi

            # Build the Astro site natively with Bun and sync it to nginx.
            export PATH="$HOME/.bun/bin:$PATH"
            bun install --frozen-lockfile
            bun run build
            mkdir -p /data/nginx/www/demo3.starandstream.com
            rsync -avz --delete dist/ /data/nginx/www/demo3.starandstream.com/

            CONF=nginx/conf.d/demo3.starandstream.com.conf
            LIVE_CONF=/data/nginx/conf.d/demo3.starandstream.com.conf

            # First deploy only: the full config references a certificate that
            # doesn't exist yet, so nginx -t would fail. Install just the HTTP
            # block (serves the ACME challenge), get the cert, then continue.
            if [ ! -d "/data/certbot/conf/live/demo3.starandstream.com" ]; then
                awk '1; /^}/ {exit}' "$CONF" > "$LIVE_CONF"
                sudo -n nginx -t
                sudo -n nginx -s reload
                podman exec certbot certbot certonly --webroot -w /var/www/certbot \
                    -d demo3.starandstream.com --non-interactive --agree-tos \
                    -m contact@starandstream.com
            fi

            # Hash Astro's inline scripts into the CSP (fails the deploy if none
            # are found, rather than shipping a CSP that blocks the page).
            bun scripts/inject-csp-hashes.mjs "$CONF" "$LIVE_CONF"

            # Text-to-speech proxy on loopback port 3013 (3010-3012 are taken
            # by alvin, cedarandsage and starandstream).
            podman build -t demo3-voice-api:latest -f voice-api/Containerfile voice-api
            podman rm -f demo3-voice 2>/dev/null || true
            podman run -d --name demo3-voice \
                --network nginx-net \
                --restart always \
                -p 127.0.0.1:3013:3000 \
                --env-file /data/env/demo3.env \
                demo3-voice-api:latest

            sudo -n nginx -t
            sudo -n nginx -s reload
            echo "nginx reloaded"
