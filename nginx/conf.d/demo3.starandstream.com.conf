server {
    listen 80;
    listen [::]:80;
    server_name demo3.starandstream.com;
    server_tokens off;

    # Let's Encrypt webroot for validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;

    server_name demo3.starandstream.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/demo3.starandstream.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo3.starandstream.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSLdemo3:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Astro inlines its island bootstrap scripts; the deploy hashes them into
    # __CSP_SCRIPT_HASHES__. Fonts are self-hosted. media-src allows the blob:
    # URL the page creates for the returned MP3. style-src needs 'unsafe-inline'
    # for Radix UI's positioning style attributes.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; upgrade-insecure-requests" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    root /var/www/demo3.starandstream.com;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html =404;
        expires epoch;
    }

    # Hashed, content-addressed build assets: cache for a year.
    location ^~ /_astro/ {
        expires 1y;
        access_log off;
    }

    # Text-to-speech proxy container, published on loopback only.
    location = /api/tts {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3013/tts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
